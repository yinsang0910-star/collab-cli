---
# 编排器配置
# 放置位置: .shared/orchestrator.yaml
---

agents:
  claude-01:
    type: claude
    binary: claude
    default_args: ["--output-format", "json"]
    timeout: 300000
    model: null

  reasonix-01:
    type: reasonix
    binary: reasonix
    timeout: 300000

  codex-01:
    type: codex
    binary: codex
    default_args: ["--output-format", "json"]
    timeout: 300000

  aider-01:
    type: aider
    binary: aider
    timeout: 300000

  workbuddy-01:
    type: workbuddy
    poll_interval: 5000
    max_polls: 60

  cursor-01:
    type: cursor
    timeout: 300000

  windsurf-01:
    type: windsurf
    binary: windsurf
    timeout: 300000

  devin-01:
    type: devin
    timeout: 300000

  copilot-01:
    type: copilot
    binary: gh
    timeout: 300000

  continue-01:
    type: continue
    api_url: "http://localhost:6543"
    timeout: 300000

defaults:
  working_directory: "."
  timeout: 300000
  approval_required: true
