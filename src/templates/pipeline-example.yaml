# 流水线定义

### Step 1: 代码审查
- **Agent**: claude-01
- **失败策略**: abort

```
审查 {{file_path}} 的代码质量：
1. 检查错误处理是否完善
2. 检查是否有潜在的性能问题
3. 检查代码风格是否一致
输出格式：问题列表 + 整体评分（0-100）
```

### Step 2: 运行测试
- **Agent**: codex-01
- **依赖**: 代码审查

```
对 {{file_path}} 运行测试：
1. 执行现有测试套件
2. 报告通过/失败数量
3. 报告覆盖率
输出格式：测试结果 + 覆盖率百分比
```

### Step 3: 综合评估
- **Agent**: claude-01
- **依赖**: 代码审查, 运行测试

```
综合评估：

代码审查结果:
{{代码审查}}

测试结果:
{{运行测试}}

请给出：
1. 是否可以合并的建议
2. 需要修复的问题列表（如果有）
3. 整体质量评分
```

---

## 审批

需要用户确认: 是
